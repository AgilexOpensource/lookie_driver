# Joint bridge for lookie__pf-lookie_trio_r01__ee-agx_gripper_r01.
# Robot-side names follow lookie_description URDF; gripper mimic joints
# (*_gripper_joint1/2) are not bridged.

namespace: trio
feedback_topic: feedback/joint_states
control_topic: control/joint_states
feedback_rate: 50.0

modules:
  - name: fold
    namespace: fold
    joints:
      - torso_joint1
      - torso_joint2
      - torso_joint3
      - torso_joint4

  - name: head
    namespace: head
    joints:
      - head_joint1
      - head_joint2

  - name: left_arm
    namespace: left_arm
    joint_map:
      joint1: l_arm_joint1
      joint2: l_arm_joint2
      joint3: l_arm_joint3
      joint4: l_arm_joint4
      joint5: l_arm_joint5
      joint6: l_arm_joint6
      joint7: l_arm_joint7
      gripper: l_gripper

  - name: right_arm
    namespace: right_arm
    joint_map:
      joint1: r_arm_joint1
      joint2: r_arm_joint2
      joint3: r_arm_joint3
      joint4: r_arm_joint4
      joint5: r_arm_joint5
      joint6: r_arm_joint6
      joint7: r_arm_joint7
      gripper: r_gripper
